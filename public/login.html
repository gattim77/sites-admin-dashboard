<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Third-AI · Admin login</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head><body><main><div class="brand">Ⅲ · THIRD–AI</div><p class="eyebrow">PRIVATE ADMINISTRATION</p><h1 id="title">Sign in</h1><p id="intro">Enter your Admin password and the code from your authenticator.</p><form id="login"><label>Email<input id="email" type="email" value="gattim@gmail.com" readonly autocomplete="username"></label><label>Admin password<input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><label id="code-label">Authenticator code<input id="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><button id="submit">Sign in</button></form><section id="enrollment" hidden><p>Scan this QR code with your authenticator app and keep the setup key somewhere safe.</p><img id="qr" alt="Authenticator enrollment QR code" width="256" height="256"><p class="key" id="key"></p><form id="confirm"><label>Six-digit authenticator code<input id="confirm-code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code"></label><button>Finish setup</button></form></section><p id="message" role="alert" aria-live="polite"></p><footer>Access is restricted to gattim@gmail.com.</footer></main></body></html>
